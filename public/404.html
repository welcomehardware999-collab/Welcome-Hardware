<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Welcome Hardware</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // into just a query string, and then redirects the browser
      // to the new url with only a query string and hash, e.g.
      // https://username.github.io/repo/shop -> https://username.github.io/repo/?/shop
      var pathSegmentsToKeep = 1;

      var l = window.location;
      var repoSegments = l.pathname.split('/').filter(Boolean);
      // If deployed at root (custom domain), pathSegmentsToKeep is 0
      // If deployed on github.io/repo/, pathSegmentsToKeep is 1
      var isGithubIo = l.hostname.indexOf('github.io') !== -1;
      var segmentsToKeep = isGithubIo ? 1 : 0;

      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
